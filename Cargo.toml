[package]
name = "rust-browser"
version = "0.1.0"
edition = "2021"

[dependencies]
webview2-com = "0.33"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_System_Com",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
